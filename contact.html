<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Movie Night</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Specific styles just for the contact form */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
            text-align: left;
        }
        .contact-form label {
            color: var(--accent-color);
            font-weight: bold;
        }
        .contact-form input, .contact-form textarea {
            padding: 10px;
            border: 1px solid var(--accent-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 4px;
        }
        .contact-form button {
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .contact-form button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container">
        <header class="marquee-header">
            <h1>Box Office</h1>
            <p>Get in touch with the crew.</p>
        </header>

        <section class="theatre-screen">
            <form action="#" method="POST" class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required placeholder="What's on your mind?"></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <nav class="footer-nav">
            <a href="about.html">About Us</a>
            <a href="terms.html">Terms of Service</a>
            <a href="contact.html">Contact Form</a>
        </nav>
        <p>&copy; 2026 Movie Night Productions.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
